{% extends 'base.html'%}
{% load static %}
{% block content %}

<style>
/* CKEditor content base */
.ckeditor-content {
    width: 100%;
}

/* Table auto-fit (NO SCROLL, NO CUT) */
.ckeditor-content table {
    width: 100% !important;
    max-width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
}

/* Cell behavior */
.ckeditor-content th,
.ckeditor-content td {
    border: 1px solid #ddd;
    padding: 8px;
    white-space: normal;
    word-break: break-word;
}

/* Header style */
.ckeditor-content th {
    background-color: #f5f5f5;
    font-weight: 600;
}

/* Mobile handling */
@media (max-width: 768px) {
    .ckeditor-content table {
        font-size: 14px;
    }
}
</style>

<!-- Page Header Start -->
<div class="container-fluid page-header mb-5 wow fadeIn bg-light {% if site_banner.background_video %}has-video{% endif %}"
     data-wow-delay="0.1s"
     {% if not site_banner.background_video and site_banner and site_banner.image %}
     style="background-image: url('{{ site_banner.image.url }}');"{% endif %}>

    {% if site_banner.background_video %}
    <video class="header-video"
           autoplay muted loop playsinline preload="metadata"
           aria-hidden="true" tabindex="-1"
           {% if site_banner.image %}poster="{{ site_banner.image.url }}"{% endif %}>
        <source src="{{ site_banner.background_video.url }}" type="video/mp4">
        <source src="{{ site_banner.background_video.url }}" type="video/webm">
    </video>
    {% endif %}

<!--    <div class="container">-->
<!--        <h1 class="display-3 text-dark animated slideInRight">About Us</h1>-->
<!--        <nav aria-label="breadcrumb">-->
<!--            <ol class="breadcrumb animated slideInRight mb-0">-->
<!--                <li class="breadcrumb-item"><a href="#" class="text-dark">Home</a></li>-->
<!--                <li class="breadcrumb-item"><a href="#" class="text-dark">Pages</a></li>-->
<!--                <li class="breadcrumb-item active text-dark" aria-current="page">About Us</li>-->
<!--            </ol>-->
<!--        </nav>-->
<!--    </div>-->
</div>
<!-- Page Header End -->

<!-- START SECTION UI ELEMENT -->
<section class="about-us bg-white-1">
    <div class="container">
        <div class="row">
            {% for section in about_sections %}
                <div class="sec-title w-100">
                    <br><br>
                    <h2>{{ section.title }}</h2>
                </div>
                <div class="col-lg-12 col-md-12 mb70 bg-shb p-3 who-1">
                    <!-- CKEditor Content -->
                    <div class="pftext ckeditor-content">
                        {{ section.description|safe }}
                    </div>
                </div>
            {% empty %}
                <div class="col-12 text-center">
                    <p>No content available.</p>
                </div>
            {% endfor %}

        </div>
    </div>
</section>
<!-- END SECTION UI ELEMENT -->

{% endblock %}
