{% extends 'base.html'%}
{% load static %}
{% block content %}

    <!-- Page Header Start -->
    <div class="container-fluid page-header py-5 mb-5 wow fadeIn bg-light" data-wow-delay="0.1s"
     {% if site_banner and site_banner.image %}style="background-image: url('{{ site_banner.image.url }}');"{% endif %}>
        <div class="container py-5">
            <h1 class="display-3 text-dark animated slideInRight">Gallery</h1>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb animated slideInRight mb-0">
                    <li class="breadcrumb-item"><a href="#" class="text-dark">Home</a></li>
                    <li class="breadcrumb-item"><a href="#" class="text-dark">Pages</a></li>
                    <li class="breadcrumb-item active text-dark" aria-current="page">Gallery</li>
                </ol>
            </nav>
        </div>
    </div>
    <!-- Page Header End -->


    <!-- Project Start -->
    <!-- Gallery Start -->
    <div class="container py-5 my-5">
    <div class="text-center mx-auto" style="max-width:600px;">
    <p class="fw-medium text-uppercase text-primary mb-2">Our Gallery</p>
        <h1 style="font-size:2.5rem; font-weight:700; margin-bottom:50px;">
            See What We Have Completed Recently
        </h1>
    </div>

    <div class="row g-4">
        <!-- Item 1 -->
        <div class="row g-4">

    {% for gallery in galleries %}
    <div class="col-lg-3 col-md-4 col-sm-6">

        <div style="
            position:relative;
            overflow:hidden;
            border-radius:12px;
            background:#fff;
            box-shadow:0 12px 30px rgba(0,0,0,0.08);
            transition:all 0.4s ease;
        "
        onmouseover="this.style.transform='translateY(-6px)'; this.style.boxShadow='0 20px 45px rgba(0,0,0,0.15)'"
        onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 12px 30px rgba(0,0,0,0.08)'">

            <!-- Image -->
            <div style="height:230px; overflow:hidden;">
                {% if gallery.image %}
                <img src="{{ gallery.image.url }}"
                     alt="{{ gallery.title }}"
                     style="
                        width:100%;
                        height:100%;
                        object-fit:cover;
                        transition:transform 0.6s ease;
                     "
                     onmouseover="this.style.transform='scale(1.1)'"
                     onmouseout="this.style.transform='scale(1)'">
                {% endif %}
            </div>

            <!-- Overlay -->
            <div style="
                position:absolute;
                inset:0;
                background:linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.2));
                display:flex;
                align-items:flex-end;
                justify-content:center;
                padding:20px;
                opacity:0;
                transition:opacity 0.4s ease;
            "
            onmouseover="this.style.opacity='1'"
            onmouseout="this.style.opacity='0'">

                <h5 style="
                    color:#fff;
                    font-weight:600;
                    margin:0;
                    letter-spacing:0.5px;
                    text-align:center;
                ">
                    {{ gallery.title }}
                </h5>
            </div>

        </div>
    </div>
    {% endfor %}

</div>

    </div>
</div>
<!-- Gallery End -->
{% endblock %}
